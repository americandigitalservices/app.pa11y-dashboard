# pa11y-dashboard
services:
  web:
    container_name: pa11y-dashboard
    restart: always
    build: .
    ports:
      - "8310:8310"
    depends_on:
      - mongo
  mongo:
    container_name: mongo
    image: mongo:latest
    volumes:
      - ./data:/data/db
    ports:
      - "27017:27017"