# pa11y-dashboard
services:
  web:
    container_name: pa11y-dashboard
    restart: "no"
    build:
      context: .
      pull: true
    ports:
      - "8310:8310"
    depends_on:
      - mongo
  mongo:
    container_name: mongo
    image: mongo:latest
    restart: "no"
    volumes:
      - ./data:/data/db
    ports:
      - "27017:27017"